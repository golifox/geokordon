name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release runs it first.
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run lint

  test:
    # Root, nft and NET_ADMIN, so the nft -c and migration tests run too.
    runs-on: ubuntu-24.04
    container:
      image: debian:12
      options: --cap-add NET_ADMIN
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update -qq && apt-get install -y -qq bats nftables gzip
      - run: bats test

  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: scripts/build
      - name: A VPN container with a published UDP port
        run: docker run -d --name amnezia-ci -p 41000:41000/udp alpine:3.20 sleep infinity
      - run: sudo dist/geokordon install
      - name: status
        run: |
          sudo geokordon status | tee status.txt
          grep -q 'Geoblock: on' status.txt
          grep -q 'udp 41000' status.txt
          systemctl is-enabled geokordon-restore.service geokordon.timer
      - name: direct list
        run: |
          sudo geokordon allow add 1.1.1.1 one.one.one.one
          sudo geokordon allow list | grep -q 1.0.0.1
          sudo geokordon allow del one.one.one.one
          sudo nft list set inet geokordon allow4 | grep -q 1.1.1.1
      - name: boot restore
        run: |
          sudo nft delete table inet geokordon
          sudo systemctl restart geokordon-restore.service
          sudo nft list table inet geokordon >/dev/null
      - name: remove
        run: |
          sudo geokordon remove
          if sudo nft list table inet geokordon 2>/dev/null; then exit 1; fi
          test ! -e /usr/local/sbin/geokordon
          test ! -e /etc/geokordon
